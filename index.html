<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>লাইভ স্পিড ট্র্যাকার</title>
<style>
  body{margin:0;background:#0b0f14;color:#e8eef5;font-family:system-ui,sans-serif}
  #wrap{position:relative;width:100%}
  video,canvas{width:100%;display:block}
  canvas{position:absolute;left:0;top:0;touch-action:manipulation}
  #ui{padding:10px}
  button{background:#1f6feb;color:#fff;border:0;border-radius:8px;padding:11px 14px;margin:4px 4px 4px 0;font-size:15px}
  button.g{background:#2d333b}
  label{font-size:13px;margin-right:8px}
  input{width:64px;padding:6px;border-radius:6px;border:1px solid #444;background:#161b22;color:#fff}
  #st{font-size:13px;color:#9fb3c8;margin:6px 0;min-height:18px}
</style>
</head>
<body>
<div id="wrap"><video id="v" playsinline muted></video><canvas id="c"></canvas></div>
<div id="ui">
  <div>
    <button id="bCam">১. ক্যামেরা চালু</button>
    <button id="bCal" class="g">২. ক্যালিব্রেট</button>
    <button id="bRun">৩. স্টার্ট</button>
    <button id="bCsv" class="g">CSV সেভ</button>
  </div>
  <div>
    <label>প্রস্থ (মি) <input id="iW" type="number" value="10.5" step="0.1"></label>
    <label>দৈর্ঘ্য (মি) <input id="iL" type="number" value="30" step="0.5"></label>
    <label>গতিসীমা <input id="iLim" type="number" value="80"></label>
  </div>
  <div id="st">প্রথমে "ক্যামেরা চালু" চাপো</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.17.3/dist/ort.min.js"></script>
<script>
// ================= সেটিংস =================
const MODEL_URL = "yolov8n.onnx";   // ফোন ধীর হলে n, শক্তিশালী হলে s ব্যবহার করো
const SZ = 640;                      // মডেল ইনপুট সাইজ
const CLASSES = {2:"Car", 3:"Bike", 5:"Bus", 7:"Truck"};
const CONF = 0.35, NMS_IOU = 0.5;
const WINDOW_SEC = 1.5;              // স্পিডের জন্য সময়ের উইন্ডো
const MIN_SAMPLES = 6, MIN_SPAN = 0.6;
const MAX_GAP = 0.8;                 // এর বেশি হারালে হিস্ট্রি রিসেট
const MAX_AGE = 1.0;                 // ট্র্যাক হারানোর সময়সীমা
const EMA = 0.3, MIN_KPH = 3, MAX_KPH = 220;
const GREEN = 60, YELLOW = 100;

const $ = id => document.getElementById(id);
const v = $("v"), cv = $("c"), ctx = cv.getContext("2d");
const off = document.createElement("canvas"); off.width = off.height = SZ;
const octx = off.getContext("2d", {willReadFrequently:true});

let session = null, running = false, calibMode = false;
let pts = [], H = null, tracks = [], nextId = 1, fps = 0, lastT = 0;
const done = {};   // শেষ হওয়া/চলমান ট্র্যাকের রেকর্ড

const status = s => $("st").textContent = s;

// ================= হোমোগ্রাফি (পিক্সেল -> মিটার) =================
function solveH(src, dst){
  const A = [];
  for(let i=0;i<4;i++){
    const [x,y]=src[i], [u,w]=dst[i];
    A.push([x,y,1,0,0,0,-u*x,-u*y,u]);
    A.push([0,0,0,x,y,1,-w*x,-w*y,w]);
  }
  const n = 8;
  for(let c=0;c<n;c++){
    let p=c;
    for(let r=c+1;r<n;r++) if(Math.abs(A[r][c])>Math.abs(A[p][c])) p=r;
    [A[c],A[p]]=[A[p],A[c]];
    for(let r=0;r<n;r++){
      if(r===c) continue;
      const f=A[r][c]/A[c][c];
      for(let k=c;k<=n;k++) A[r][k]-=f*A[c][k];
    }
  }
  return A.map((row,i)=>row[n]/row[i]);
}
function warp(h,x,y){
  const w=h[6]*x+h[7]*y+1;
  return [(h[0]*x+h[1]*y+h[2])/w,(h[3]*x+h[4]*y+h[5])/w];
}
function inPoly(x,y,p){
  let ins=false;
  for(let i=0,j=p.length-1;i<p.length;j=i++){
    const [xi,yi]=p[i],[xj,yj]=p[j];
    if((yi>y)!==(yj>y) && x<(xj-xi)*(y-yi)/(yj-yi)+xi) ins=!ins;
  }
  return ins;
}
function buildH(){
  const W=+$("iW").value, L=+$("iL").value;
  if(pts.length===4 && W>0 && L>0){
    H = solveH(pts, [[0,0],[W,0],[W,L],[0,L]]);
    try{ localStorage.setItem("cal",JSON.stringify({pts,W,L,vw:v.videoWidth,vh:v.videoHeight})); }catch(e){}
    return true;
  }
  return false;
}

// ================= ক্যামেরা ও মডেল =================
$("bCam").onclick = async () => {
  try{
    status("ক্যামেরা চালু হচ্ছে...");
    const stream = await navigator.mediaDevices.getUserMedia({
      video:{facingMode:"environment", width:{ideal:1280}, height:{ideal:720}}, audio:false});
    v.srcObject = stream; await v.play();
    cv.width = v.videoWidth; cv.height = v.videoHeight;
    try{ await navigator.wakeLock.request("screen"); }catch(e){}
    // আগের ক্যালিব্রেশন ফেরত আনা (একই রেজোলিউশন হলে)
    try{
      const s = JSON.parse(localStorage.getItem("cal")||"null");
      if(s && s.vw===v.videoWidth && s.vh===v.videoHeight){
        pts=s.pts; $("iW").value=s.W; $("iL").value=s.L; buildH();
      }
    }catch(e){}
    status("মডেল লোড হচ্ছে...");
    try{ session = await ort.InferenceSession.create(MODEL_URL,{executionProviders:["webgl","wasm"]}); }
    catch(e){ session = await ort.InferenceSession.create(MODEL_URL,{executionProviders:["wasm"]}); }
    status(H ? "রেডি। স্টার্ট চাপো।" : "রেডি। এবার ক্যালিব্রেট করো।");
    tick();
  }catch(e){ status("ত্রুটি: "+e.message); }
};

// ================= ক্যালিব্রেশন (৪ পয়েন্ট ট্যাপ) =================
$("bCal").onclick = () => {
  calibMode = true; running = false; pts = []; H = null;
  $("bRun").textContent = "৩. স্টার্ট";
  status("ক্রমে ট্যাপ করো: ১=দূরে-বামে ২=দূরে-ডানে ৩=কাছে-ডানে ৪=কাছে-বামে");
};
cv.addEventListener("pointerdown", e => {
  if(!calibMode) return;
  const r = cv.getBoundingClientRect();
  pts.push([(e.clientX-r.left)*cv.width/r.width, (e.clientY-r.top)*cv.height/r.height]);
  if(pts.length===4){
    calibMode=false;
    status(buildH() ? "ক্যালিব্রেশন সম্পন্ন। স্টার্ট চাপো।" : "প্রস্থ/দৈর্ঘ্য ঠিক দাও, তারপর আবার ক্যালিব্রেট করো");
  }
});
$("bRun").onclick = () => {
  if(!session) return status("আগে ক্যামেরা চালু করো");
  if(!H && !buildH()) return status("আগে ক্যালিব্রেট করো");
  running = !running;
  $("bRun").textContent = running ? "থামাও" : "৩. স্টার্ট";
  status(running ? "চলছে..." : "থামানো হয়েছে");
};

// ================= ডিটেকশন =================
function iou(a,b){
  const x1=Math.max(a[0],b[0]), y1=Math.max(a[1],b[1]);
  const x2=Math.min(a[2],b[2]), y2=Math.min(a[3],b[3]);
  const i=Math.max(0,x2-x1)*Math.max(0,y2-y1);
  const u=(a[2]-a[0])*(a[3]-a[1])+(b[2]-b[0])*(b[3]-b[1])-i;
  return u>0 ? i/u : 0;
}
async function detect(){
  const vw=v.videoWidth, vh=v.videoHeight;
  const s=Math.min(SZ/vw,SZ/vh), nw=vw*s, nh=vh*s, dx=(SZ-nw)/2, dy=(SZ-nh)/2;
  octx.fillStyle="#727272"; octx.fillRect(0,0,SZ,SZ);
  octx.drawImage(v,dx,dy,nw,nh);
  const d=octx.getImageData(0,0,SZ,SZ).data, N=SZ*SZ, f=new Float32Array(3*N);
  for(let i=0;i<N;i++){ f[i]=d[i*4]/255; f[N+i]=d[i*4+1]/255; f[2*N+i]=d[i*4+2]/255; }
  const out = await session.run({[session.inputNames[0]]:new ort.Tensor("float32",f,[1,3,SZ,SZ])});
  const o = out[session.outputNames[0]].data, M = o.length/84;  // [1,84,M]
  let c=[];
  for(let i=0;i<M;i++){
    let best=0, bc=-1;
    for(const k in CLASSES){ const sc=o[(4+ +k)*M+i]; if(sc>best){best=sc;bc=+k;} }
    if(best<CONF) continue;
    const cx=o[i], cy=o[M+i], w=o[2*M+i], h=o[3*M+i];
    c.push({box:[(cx-w/2-dx)/s,(cy-h/2-dy)/s,(cx+w/2-dx)/s,(cy+h/2-dy)/s], sc:best, cls:bc});
  }
  c.sort((a,b)=>b.sc-a.sc);
  const keep=[];
  for(const x of c){ if(keep.every(k=>iou(k.box,x.box)<NMS_IOU)) keep.push(x); }
  return keep;
}

// ================= ট্র্যাকিং ও স্পিড =================
function slope(t,y){
  const n=t.length, mt=t.reduce((a,b)=>a+b)/n, my=y.reduce((a,b)=>a+b)/n;
  let nu=0, de=0;
  for(let i=0;i<n;i++){ nu+=(t[i]-mt)*(y[i]-my); de+=(t[i]-mt)**2; }
  return de>0 ? nu/de : 0;
}
function update(dets, t){
  // প্রতিটি ট্র্যাকের অনুমিত বক্স (গতি ধরে)
  for(const k of tracks){
    const dt=t-k.t, [x1,y1,x2,y2]=k.box;
    k.pred=[x1+k.vx*dt,y1+k.vy*dt,x2+k.vx*dt,y2+k.vy*dt];
    k.hit=false;
  }
  const pairs=[];
  dets.forEach((d,i)=>tracks.forEach((k,j)=>{
    const q=iou(d.box,k.pred); if(q>0.15) pairs.push([q,i,j]);
  }));
  pairs.sort((a,b)=>b[0]-a[0]);
  const usedD=new Set(), usedT=new Set();
  for(const [q,i,j] of pairs){
    if(usedD.has(i)||usedT.has(j)) continue;
    usedD.add(i); usedT.add(j);
    const k=tracks[j], d=dets[i], dt=Math.max(t-k.t,1e-3);
    const ocx=(k.box[0]+k.box[2])/2, ocy=(k.box[1]+k.box[3])/2;
    const ncx=(d.box[0]+d.box[2])/2, ncy=(d.box[1]+d.box[3])/2;
    k.vx=0.5*k.vx+0.5*(ncx-ocx)/dt; k.vy=0.5*k.vy+0.5*(ncy-ocy)/dt;
    k.box=d.box; k.t=t; k.hits++; k.hit=true; k.cls=d.cls;
    measure(k,t);
  }
  dets.forEach((d,i)=>{
    if(!usedD.has(i)) tracks.push({id:nextId++,cls:d.cls,box:d.box,vx:0,vy:0,t,hits:1,hist:[],spd:null,hit:true});
  });
  tracks=tracks.filter(k=>t-k.t<=MAX_AGE);
}
function measure(k,t){
  const [x1,y1,x2,y2]=k.box, fx=(x1+x2)/2, fy=y2;
  // ফ্রেমের নিচে কেটে গেলে বা জোনের বাইরে হলে মাপা হবে না
  if(k.hits<3 || y2>=v.videoHeight-3 || !inPoly(fx,fy,pts)) return;
  const [X,Y]=warp(H,fx,fy), h=k.hist;
  if(h.length && t-h[h.length-1].t>MAX_GAP){ h.length=0; k.spd=null; }
  h.push({t,X,Y});
  while(h.length && t-h[0].t>WINDOW_SEC) h.shift();
  if(h.length<MIN_SAMPLES || h[h.length-1].t-h[0].t<MIN_SPAN) return;
  const ts=h.map(p=>p.t);
  let kph=Math.hypot(slope(ts,h.map(p=>p.X)),slope(ts,h.map(p=>p.Y)))*3.6;
  if(kph>MAX_KPH) return;
  if(kph<MIN_KPH) kph=0;
  k.spd = k.spd===null ? kph : EMA*kph+(1-EMA)*k.spd;
  k.seen=t;
  const r=done[k.id]||(done[k.id]={cls:CLASSES[k.cls],s:[]});
  r.s.push(k.spd);
}

// ================= ড্রয়িং =================
function col(k){ return k<GREEN?"#00c800":k<YELLOW?"#ffd700":"#ff3030"; }
function draw(t){
  const fs=Math.max(14,cv.width/55);
  ctx.clearRect(0,0,cv.width,cv.height);
  ctx.lineWidth=Math.max(2,cv.width/400);
  if(pts.length){
    ctx.strokeStyle="#00bfff"; ctx.fillStyle="#00bfff"; ctx.font=fs+"px sans-serif";
    ctx.beginPath(); pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));
    if(pts.length===4) ctx.closePath(); ctx.stroke();
    pts.forEach((p,i)=>{ ctx.beginPath(); ctx.arc(p[0],p[1],fs/2,0,7); ctx.fill(); ctx.fillText(i+1,p[0]+fs/2,p[1]-fs/2); });
  }
  ctx.font="bold "+fs+"px sans-serif";
  for(const k of tracks){
    if(!running || k.hits<3) continue;
    const [x1,y1,x2,y2]=k.box, ok=k.spd!==null && t-(k.seen||0)<=MAX_GAP;
    const c=ok?col(k.spd):"#cccccc";
    ctx.strokeStyle=c; ctx.strokeRect(x1,y1,x2-x1,y2-y1);
    const label=CLASSES[k.cls]+" #"+k.id+(ok?" "+Math.round(k.spd)+" km/h":"");
    const tw=ctx.measureText(label).width+8, ty=Math.max(y1,fs+4);
    ctx.fillStyle=c; ctx.fillRect(x1,ty-fs-4,tw,fs+6);
    ctx.fillStyle="#000"; ctx.fillText(label,x1+4,ty-4);
  }
  const lim=+$("iLim").value, ids=Object.values(done).filter(r=>r.s.length>=5);
  const over=ids.filter(r=>median(r.s)>lim).length;
  ctx.fillStyle="rgba(0,0,0,.6)"; ctx.fillRect(6,6,fs*13,fs*3.4);
  ctx.fillStyle="#fff"; ctx.font=fs+"px sans-serif";
  ctx.fillText("FPS: "+fps.toFixed(1),12,6+fs);
  ctx.fillText("Measured: "+ids.length,12,6+fs*2.1);
  ctx.fillStyle="#ff6060"; ctx.fillText("Over "+lim+": "+over,12,6+fs*3.2);
}

// ================= মূল লুপ =================
async function tick(){
  const t=performance.now()/1000;   // ফ্রেম নেওয়ার মুহূর্তের আসল সময়
  if(running && session){
    try{
      const dets=await detect();
      update(dets,t);
      fps=0.8*fps+0.2*(1/Math.max(t-lastT,1e-3));
    }catch(e){ status("ত্রুটি: "+e.message); running=false; }
  }
  lastT=t; draw(t);
  requestAnimationFrame(tick);
}

// ================= CSV সেভ =================
function median(a){ const s=[...a].sort((x,y)=>x-y), m=s.length>>1; return s.length%2?s[m]:(s[m-1]+s[m])/2; }
$("bCsv").onclick = () => {
  const lim=+$("iLim").value;
  let rows=["track_id,class,samples,median_kph,p95_kph,max_kph,speeding"];
  for(const id in done){
    const r=done[id]; if(r.s.length<5) continue;
    const s=[...r.s].sort((a,b)=>a-b);
    rows.push([id,r.cls,s.length,median(s).toFixed(1),s[Math.floor(s.length*0.95)].toFixed(1),s[s.length-1].toFixed(1),median(s)>lim?"yes":"no"].join(","));
  }
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([rows.join("\n")],{type:"text/csv"}));
  a.download="speed_log.csv"; a.click();
};
</script>
</body>
</html>
